[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bits-console-backend"
version = "0.1.0"
description = "bits-console backend — relying party and the security-proxy's only client"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.10.1",
    "webauthn==2.5.2",
]
# bits_helpers is provided by the surrounding bits repo (on PYTHONPATH / copied
# alongside in the image), not a PyPI dependency.

[tool.setuptools]
packages = ["console_backend"]
