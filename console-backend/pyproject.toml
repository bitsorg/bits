[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bits-console-backend"
version = "0.1.0"
description = "bits-console backend — relying party and the security-proxy's only client"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "webauthn==2.5.2",
    # GitLab (forge_ops) and the store through the credentials proxy (credproxy);
    # both were installed only by the image until now.
    "requests>=2.31",
    "boto3>=1.34",
    # bits_helpers' site configuration (site.py) reads YAML.
    "pyyaml",
]
# bits_helpers comes from the bits checkout this lives in (the commit bits-console
# pins as a submodule): the backend is part of bits, not released on its own.

[tool.setuptools]
packages = ["console_backend", "console_backend.orch"]
